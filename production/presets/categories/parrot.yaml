# Category preset — starting values; output-spec.yaml overrides any field.
category: parrot
family: creature
template: {kind: custom, script: production/rigs/bird_metarig.py}   # Rigify ships no bird metarig
typical_size_m: 0.35
forward_axis: -Y
focus_joints: [wing_shoulder, wing_elbow, wing_wrist, neck, head, hip, knee, toes, tail]
joint_rules:
  wing_shoulder: {type: ball, density: 1.5}
  wing_elbow: {type: hinge, loops: 3, supports: 1}
  wing_wrist: {type: hinge, loops: 2, supports: 1}
  neck: {type: chain, min_loops_per_bone: 2}
  knee: {type: hinge, loops: 2, supports: 1}
  toes: {type: digit, loops_per_knuckle: 2}
  tail: {type: chain}
rom_limits:
  wing_shoulder: {raise: [0, 25], spread: [0, 20]}      # fused-wing default; raise only if wings are separated
  wing_elbow: {open: [0, 15]}
  neck: {bend: [-40, 40], turn: [-90, 90]}
  head: {tilt: [-30, 30]}
  tail: {bend: [-25, 25], fan: [0, 15]}
default_regions: {wings: skin_limited, tail_feathers: chain, crest: chain}
fused_parts: {wings: ask_user}      # small flutter keeps them fused; full flap needs separation + rebuilt body
default_clips: [idle, head_tilt, flap, perch_bob]
